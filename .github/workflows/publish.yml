name: Publish SAVLUNE

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 1,11,21 * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Buka paket website
        run: unzip -q SAVLUNE-GitHub.zip -d website

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Siapkan website
        working-directory: website
        run: |
          npm ci
          node scripts/prepare-news.mjs
          npx next build --webpack

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/out

      - name: Terbitkan website
        id: deployment
        uses: actions/deploy-pages@v4
